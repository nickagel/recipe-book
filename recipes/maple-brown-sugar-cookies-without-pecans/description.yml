title: Maple Brown Sugar Cookies without Pecans
description: Soft, buttery and chewy maple brown sugar cookies made with dark brown sugar and pure maple syrup, finished with a sweet maple icing.
tags: [cookies, maple cookies, brown sugar, maple icing, fall baking, dessert]
category: Dessert
preheat: 350°F (175°C)
cook_time: 12–13 minutes
chill: at least 3 hours, preferably overnight
yield: about 14–15 large cookies (50g each)
