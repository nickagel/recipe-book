<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots"
          content="noindex, nofollow, noarchive, noimageindex, noai, noimageai">
    <title>Recipe Book</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300..900;1,300..900&display=swap">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="progress" role="progressbar" aria-label="Loading recipes"></div>
    <header>
      <h1>
        <a href="#">Recipe Book<span class="dot">.</span></a>
      </h1>
      <p class="tagline">Good food, saved for later.</p>
      <input id="search"
             type="search"
             placeholder="Search recipes, tags, ingredients…"
             autocomplete="off"
             aria-label="Search recipes">
    </header>
    <main>
      <ul id="results" aria-busy="true">
        <li class="card skeleton" aria-hidden="true"></li>
        <li class="card skeleton" aria-hidden="true"></li>
        <li class="card skeleton" aria-hidden="true"></li>
        <li class="card skeleton" aria-hidden="true"></li>
        <li class="card skeleton" aria-hidden="true"></li>
        <li class="card skeleton" aria-hidden="true"></li>
      </ul>
      <article id="recipe" hidden></article>
    </main>
    <script src="app.js"></script>
  </body>
</html>
